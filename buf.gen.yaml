version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/tltre/gogent/internal/grpctransport/gogentv1
plugins:
  - remote: buf.build/protocolbuffers/go
    out: internal/grpctransport/gogentv1
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: internal/grpctransport/gogentv1
    opt: paths=source_relative
