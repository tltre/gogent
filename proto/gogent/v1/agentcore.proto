syntax = "proto3";

package gogent.v1;

option go_package = "github.com/tltre/gogent/internal/grpctransport/gogentv1";

import "google/protobuf/struct.proto";

// AgentCoreService executes agent logic and streams execution events.
service AgentCoreService {
  // Run executes the agent with the given input and returns the final output.
  rpc Run(RunRequest) returns (RunResponse);

  // Stream executes the agent and streams execution events back to the caller.
  rpc Stream(RunRequest) returns (stream AgentEvent);
}

// EventType enumerates the lifecycle events emitted during agent execution.
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_BEFORE_RUN = 1;
  EVENT_TYPE_AFTER_RUN = 2;
  EVENT_TYPE_BEFORE_TOOL = 3;
  EVENT_TYPE_AFTER_TOOL = 4;
  EVENT_TYPE_BEFORE_LLM = 5;
  EVENT_TYPE_AFTER_LLM = 6;
  EVENT_TYPE_ERROR = 7;
  EVENT_TYPE_STREAMING = 8;
}

// Message represents a single chat message.
message Message {
  string role = 1;
  string content = 2;
  repeated AgentToolInfo tools = 3;
}

// AgentToolInfo describes a tool available to the agent.
message AgentToolInfo {
  string name = 1;
  string description = 2;
  google.protobuf.Struct parameters = 3;
}

// Action records a tool invocation requested or performed by the agent.
message Action {
  string tool_name = 1;
  google.protobuf.Struct params = 2;
  google.protobuf.Value result = 3;
}

// AgentInput is the input to an agent execution.
message AgentInput {
  repeated Message messages = 1;
  google.protobuf.Struct context = 2;
}

// AgentOutput is the result of an agent execution.
message AgentOutput {
  Message response = 1;
  repeated Action actions = 2;
  google.protobuf.Struct metadata = 3;
}

message RunRequest {
  AgentInput input = 1;
}

message RunResponse {
  AgentOutput output = 1;
}

// AgentEvent is a lifecycle event emitted during agent execution.
message AgentEvent {
  EventType type = 1;
  google.protobuf.Value payload = 2;
  string error = 3;
}
