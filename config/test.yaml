name: test-agent
version: "0.1.0"

interface:
  type: cli
  cli:
    banner: "Test Agent"
    prompt: "> "

components:
  - name: "agent-daemon"
    type: "agentcore"
    driver: "process"
    config:
      command: "daemon.exe"
      env:
        - "GAGENT_DAEMON_TYPE=agentcore"

  - name: "provider-daemon"
    type: "provider"
    driver: "process"
    config:
      command: "daemon.exe"
      env:
        - "GAGENT_DAEMON_TYPE=provider"

  - name: "tools-daemon"
    type: "tool"
    driver: "process"
    config:
      command: "daemon.exe"
      env:
        - "GAGENT_DAEMON_TYPE=tool"

  - name: "hooks-daemon"
    type: "hook"
    driver: "process"
    config:
      command: "daemon.exe"
      env:
        - "GAGENT_DAEMON_TYPE=hook"

  - name: "context-daemon"
    type: "contextmanager"
    driver: "process"
    config:
      command: "daemon.exe"
      env:
        - "GAGENT_DAEMON_TYPE=contextmanager"

  - name: "memory-daemon"
    type: "memory"
    driver: "process"
    config:
      command: "daemon.exe"
      env:
        - "GAGENT_DAEMON_TYPE=memory"

  - name: "eventbus-daemon"
    type: "eventbus"
    driver: "process"
    config:
      command: "daemon.exe"
      env:
        - "GAGENT_DAEMON_TYPE=eventbus"

  - name: "sandbox-daemon"
    type: "sandbox"
    driver: "process"
    config:
      command: "daemon.exe"
      env:
        - "GAGENT_DAEMON_TYPE=sandbox"

  - name: "channel-daemon"
    type: "channel"
    driver: "process"
    config:
      command: "daemon.exe"
      env:
        - "GAGENT_DAEMON_TYPE=channel"

defaults:
  agentcore: "agent-daemon"
  provider: "provider-daemon"
  tool: "tools-daemon"
  hook: "hooks-daemon"
  contextmanager: "context-daemon"
  memory: "memory-daemon"
  eventbus: "eventbus-daemon"
  sandbox: "sandbox-daemon"
  channel: "channel-daemon"
