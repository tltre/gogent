name: verify-agent
version: "1.0.0"

interface:
  type: cli
  cli:
    banner: "Provider Verify Agent — use /provider and /model to switch"
    prompt: "> "

# 工具声明（v0.12.2 声明式设计）：builtin 工具也必须显式声明才可用。
# daemon 内置：calculator（计算）/ think（推理）/ todo（待办）。
tools:
  - name: calculator
    securityLevel: 0
  - name: think
    securityLevel: 0
  - name: todo
    securityLevel: 0

components:
  # native provider：默认全开 openai + deepseek（无 exclude）
  # （builder 注册为 ProviderManager 组件 "provider-manager"，自动成为默认 provider）
  - name: "provider-main"
    type: "provider"
    driver: "native"

  # react agentcore：ProviderManager dispatch 路由
  # （注册为 AgentRuntime，自动成为默认 agentcore）
  - name: "agent-main"
    type: "agentcore"
    driver: "native"
    config:
      type: "react"