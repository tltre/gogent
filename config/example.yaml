name: example-agent
version: "1.0.0"

interface:
  type: cli
  cli:
    banner: "Gogent Example Agent — use /provider and /model to switch"
    prompt: "> "

# OpenTelemetry 观测（v0.15.x）：导出到 OTLP collector（Jaeger/Tempo）。
# 本地观测：先启动 Jaeger（见 docs/design/observability.md），
# 再启动本应用——Jaeger 网页 http://localhost:16686 查看完整 trace。
observability:
  otel:
    enabled: true
    endpoint: "127.0.0.1:4317"   # OTLP gRPC（Jaeger 默认端口）。用 127.0.0.1 而非 localhost：
                                 # Windows 上 grpc.NewClient("localhost:...") 的双栈解析可能挂起导致导出超时
    service_name: "example-agent"
    environment: "dev"

# 工具声明（v0.12.2 声明式设计）：builtin 工具也必须显式声明才可用。
# daemon 内置：calculator（计算）/ think（推理）/ todo（待办）。
tools:
  - name: calculator
    securityLevel: 3
  - name: think
    securityLevel: 0
  - name: todo
    securityLevel: 0

components:
  # native provider：默认注册全部内置引擎（openai / deepseek / ...），
  # 用 exclude 排除不需要的引擎。
  # builder 注册为 ProviderManager 组件 "provider-manager"，自动成为默认 provider。
  - name: "provider-main"
    type: "provider"
    driver: "native"
    # config:
    #   exclude: ["deepseek"]

  # react agentcore：完整 ReAct 循环（推理 → 工具调用 → 观察 → 迭代）。
  # 注册为 AgentRuntime，自动成为默认 agentcore。
  - name: "agent-main"
    type: "agentcore"
    driver: "native"
    config:
      type: "react"
