name: verify-app

components:
  # process-driver component — daemon manages it
  - name: "provider-main"
    type: "provider"
    driver: "process"
    config:
      command: ""  # uses built-in `gogent component` subcommand

  # http-driver component — daemon registers it for monitoring
  - name: "memory-main"
    type: "memory"
    driver: "http"
    config:
      endpoint: "localhost:9999"

defaults:
  provider: "provider-main"
  memory: "memory-main"
