name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (packages)
        run: go test ./pkg/... ./internal/... -count=1

      - name: Test (native)
        run: go test ./tests/native/... -count=1

      - name: Test (CLI)
        run: go test ./tests/cli/ -count=1

  # End-to-end tests need external services (E2B API key, Jaeger).
  # They are run manually or in environments with those credentials.
  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Test (e2e)
        run: go test ./tests/e2e/ -count=1
